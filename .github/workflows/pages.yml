# Publish site/ to GitHub Pages → gentropic.org/wireframe/ (the org's custom domain serves project
# Pages under their repo name). The site is built locally by `node site/build.mjs` and committed;
# this only publishes it, minus the build sources.
name: Publish site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the published files
        run: |
          mkdir _site
          rsync -a --exclude build.mjs --exclude smoke.mjs --exclude '*.src.html' site/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
